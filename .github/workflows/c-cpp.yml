name: CMake C++ CUDA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux

          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 13 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update

          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb

          sudo apt-get update

          sudo apt-get install -y \
              cuda-toolkit-13

          echo "/usr/local/cuda/bin" >> $GITHUB_PATH

      - name: Install CUDA 13 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |

          choco install cuda --version=13.0.0 -y

          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0" >> $env:GITHUB_ENV
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0\bin" >> $env:GITHUB_PATH

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Verify CUDA
        shell: bash
        run: |
          nvcc --version

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSENTINEL_CUDA_ARCHITECTURES=75

      - name: Build
        run: |
          cmake --build build --parallel
