name: CMake C++ CUDA CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '13.0.0'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "visual_studio_integration"]'

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure (compile only, no GPU on runners)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSENTINEL_CUDA_ARCHITECTURES=75

      - name: Build
        run: cmake --build build --parallel
