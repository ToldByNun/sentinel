name: CMake C++ CUDA CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '13.0.0'
          method: network

      - name: Show CUDA version
        run: nvcc -V

      - name: Configure (compile only, no GPU on runners)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSENTINEL_CUDA_ARCHITECTURES=75

      - name: Build
        run: cmake --build build --config Release --parallel
