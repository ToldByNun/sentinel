name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Upload artifacts to PyPI (Trusted Publishing)
        type: boolean
        default: false

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Wheel (${{ matrix.name }} / cp${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            python: "3.10"
          - os: ubuntu-latest
            name: Linux
            python: "3.11"
          - os: ubuntu-latest
            name: Linux
            python: "3.12"
          - os: windows-2022
            name: Windows
            python: "3.10"
          - os: windows-2022
            name: Windows
            python: "3.11"
          - os: windows-2022
            name: Windows
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30.x"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install CUDA 13 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y \
            cuda-nvcc-13-0 \
            cuda-cudart-dev-13-0 \
            libcublas-dev-13-0 \
            g++ \
            libomp-dev
          echo "/usr/local/cuda-13.0/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=/usr/local/cuda-13.0" >> "$GITHUB_ENV"
          echo "CUDA_HOME=/usr/local/cuda-13.0" >> "$GITHUB_ENV"
          sudo ln -sfn /usr/local/cuda-13.0 /usr/local/cuda

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 13 (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.0.2"
          method: network

      - name: Re-export CUDA onto PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cuda = $env:CUDA_PATH
          if (-not $cuda -or -not (Test-Path "$cuda\bin\nvcc.exe")) {
            $candidates = @(
              "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0",
              "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.1",
              "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2",
              "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
            )
            foreach ($c in $candidates) {
              if (Test-Path "$c\bin\nvcc.exe") { $cuda = $c; break }
            }
          }
          if (-not $cuda) { throw "CUDA toolkit not found after install" }
          Write-Host "Using CUDA_PATH=$cuda"
          "$cuda\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (Test-Path "$cuda\bin\x64") {
            "$cuda\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CUDA_HOME=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check toolchain
        shell: bash
        run: |
          cmake --version
          ninja --version
          nvcc --version
          python --version

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python -m pip install --upgrade pip build
          # Fat binary via CMake default (do not pass native).
          python -m build --wheel --outdir dist

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: List dist
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}-cp${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    if: >-
      github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sentinel-lm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -la dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
